services:
  - type: web
    name: lms-cloud-runner
    runtime: node
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lms-runner-db
          property: connectionString
databases:
  - name: lms-runner-db
    plan: basic-256mb
