services:
  app:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    environment:
      RUNNER_DATA_DIR: /data
    volumes: ["runner-data:/data"]
    depends_on: [postgres]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lms_runner
    volumes: ["postgres-data:/var/lib/postgresql/data"]
volumes:
  runner-data:
  postgres-data:
